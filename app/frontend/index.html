<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusCare | Service Desk</title>
<style>
:root{--ink:#17233b;--muted:#66738a;--line:#e4e9f2;--blue:#3457d5;--wash:#f4f7fc;--green:#16856b;--amber:#a86710;--red:#b63c4b}
*{box-sizing:border-box}body{margin:0;background:var(--wash);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}header{background:#17233b;color:#fff;padding:22px max(20px,calc((100% - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}header strong{font-size:1.2rem;letter-spacing:.2px}header span{font-size:.88rem;color:#c8d3ed}.wrap{max-width:1080px;margin:28px auto;padding:0 18px}.intro{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.intro h1{margin:0 0 6px;font-size:clamp(1.5rem,4vw,2.1rem)}.intro p{margin:0;color:var(--muted)}.health{border-radius:99px;background:#e0f5ed;color:#12674f;padding:8px 12px;font-size:.82rem;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 4px 18px #243b6810}.stat{padding:17px 19px}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat b{display:block;font-size:1.8rem;margin-top:7px}.columns{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}.panel{padding:20px}.panel h2{font-size:1.05rem;margin:0 0 17px}.field{display:block;margin:13px 0}.field span{display:block;font-size:.85rem;color:#46536a;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d5dce9;border-radius:9px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}textarea{resize:vertical;min-height:90px}button{border:0;border-radius:9px;background:var(--blue);color:#fff;font:inherit;font-weight:650;padding:10px 14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.submit{width:100%;margin-top:6px}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}.toolbar h2{margin:0}.toolbar select{max-width:160px}.ticket{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}.ticket-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.ticket h3{margin:0;font-size:1rem;overflow-wrap:anywhere}.ticket p{margin:8px 0;color:var(--muted);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.pill{border-radius:99px;padding:4px 8px;font-size:.75rem;background:#eef2fb;color:#46567b}.priority-high{background:#fff0e7;color:#9a4b0a}.priority-urgent{background:#ffe8ec;color:#a5283b}.status-open{background:#e8efff;color:#2f50bb}.status-progress{background:#fff4dc;color:#85590d}.status-resolved{background:#e0f5ed;color:#12674f}.ticket-actions{display:flex;gap:8px;align-items:center}.ticket-actions select{max-width:150px;padding:7px;font-size:.83rem}.ticket-actions button{padding:7px 9px;font-size:.8rem;background:#eef1f7;color:#34415a}.empty{padding:34px 10px;text-align:center;color:var(--muted)}.error{color:var(--red);font-size:.85rem;min-height:1.2em}.muted{color:var(--muted)}@media(max-width:760px){.columns{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:1.5rem}.intro{align-items:start;flex-direction:column}header{align-items:start;flex-direction:column}.ticket-top{flex-direction:column}.ticket-actions{width:100%;flex-wrap:wrap}}
</style>
</head>
<body>
<header><strong>✦ CampusCare <span> / SERVICE DESK</span></strong><span>Student & campus support portal</span></header>
<main class="wrap">
<section class="intro"><div><h1>Support requests</h1><p>Log a campus issue and track it from open to resolved.</p></div><div class="health" id="health">Connecting to API…</div></section>
<section class="stats"><div class="stat"><span>All requests</span><b id="total">—</b></div><div class="stat"><span>Needs attention</span><b id="active">—</b></div><div class="stat"><span>Resolved</span><b id="resolved">—</b></div></section>
<div class="columns">
<section class="panel"><h2>Create a request</h2><form id="ticket-form">
<label class="field"><span>Short title</span><input id="title" maxlength="120" placeholder="e.g. Wi-Fi not working in Block B" required></label>
<label class="field"><span>Category</span><select id="category"><option>IT Support</option><option>Hostel</option><option>Classroom</option><option>Library</option><option>Facilities</option><option>Other</option></select></label>
<label class="field"><span>Priority</span><select id="priority"><option>Normal</option><option>High</option><option>Urgent</option><option>Low</option></select></label>
<label class="field"><span>Details</span><textarea id="details" maxlength="1000" placeholder="Add location and a short description…"></textarea></label>
<div class="error" id="form-error" role="alert"></div><button class="submit" id="submit">Submit request</button>
</form></section>
<section class="panel"><div class="toolbar"><h2>Request queue</h2><select id="filter" aria-label="Filter requests"><option value="all">All statuses</option><option value="Open">Open</option><option value="In Progress">In progress</option><option value="Resolved">Resolved</option></select></div><div id="tickets"><div class="empty">Loading requests…</div></div></section>
</div>
</main>
<script>
const request = async (path, options={}) => { const response=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}}); const body=await response.json().catch(()=>({error:'Unexpected server response'})); if(!response.ok) throw new Error(body.error||'Request failed'); return body; };
let records=[];
const safe = value => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const statusClass = s => s==='Resolved'?'status-resolved':s==='In Progress'?'status-progress':'status-open';
const priorityClass = p => p==='Urgent'?'priority-urgent':p==='High'?'priority-high':'';
function render(){
 document.getElementById('total').textContent=records.length;
 document.getElementById('active').textContent=records.filter(t=>t.status!=='Resolved').length;
 document.getElementById('resolved').textContent=records.filter(t=>t.status==='Resolved').length;
 const filter=document.getElementById('filter').value;
 const visible=records.filter(t=>filter==='all'||t.status===filter);
 const target=document.getElementById('tickets');
 if(!visible.length){target.innerHTML='<div class="empty">No requests here yet. Add one using the form.</div>';return;}
 target.innerHTML=visible.map(t=>`<article class="ticket"><div class="ticket-top"><h3>${safe(t.title)}</h3><span class="pill">#${t.id}</span></div><p>${safe(t.details||'No additional details provided.')}</p><div class="meta"><span class="pill">${safe(t.category)}</span><span class="pill ${priorityClass(t.priority)}">${safe(t.priority)} priority</span><span class="pill ${statusClass(t.status)}">${safe(t.status)}</span></div><div class="ticket-actions"><label class="muted" for="status-${t.id}">Update status</label><select id="status-${t.id}" onchange="updateStatus(${t.id},this.value)"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Resolved'?'selected':''}>Resolved</option></select><button type="button" onclick="removeTicket(${t.id})">Delete</button></div></article>`).join('');
}
async function refresh(){try{const h=await request('/health');document.getElementById('health').textContent=h.db?'API and database connected':'Database unavailable';records=await request('/tickets');render();}catch(e){document.getElementById('health').textContent='Service unavailable';document.getElementById('tickets').innerHTML=`<div class="empty">${safe(e.message)}. Refresh the page after the service starts.</div>`;}}
async function updateStatus(id,status){try{await request('/tickets/'+id,{method:'PATCH',body:JSON.stringify({status})});await refresh();}catch(e){alert(e.message);}}
async function removeTicket(id){if(!confirm('Delete this support request?'))return;try{await request('/tickets/'+id,{method:'DELETE'});await refresh();}catch(e){alert(e.message);}}
document.getElementById('filter').addEventListener('change',render);
document.getElementById('ticket-form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('form-error');button.disabled=true;error.textContent='';try{await request('/tickets',{method:'POST',body:JSON.stringify({title:document.getElementById('title').value,category:document.getElementById('category').value,priority:document.getElementById('priority').value,details:document.getElementById('details').value})});e.target.reset();await refresh();}catch(err){error.textContent=err.message;}finally{button.disabled=false;}});
refresh();
</script>
</body>
</html>
